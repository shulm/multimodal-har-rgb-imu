name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified via official Git ref
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified via official Git ref
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install . --no-deps
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/smoke.py
      - run: python scripts/verify_artifacts.py
      - run: python scripts/execute_notebooks.py
